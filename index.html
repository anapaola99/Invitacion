    <h2>¡Regístrate para la función!</h2>
    
    <form id="miFormulario">
        
        <input type="text" id="campoNombre" placeholder="Escribe tu nombre" required>
        <br> <br>
        <input type="text" id="campoPaterno" placeholder="Apellido Paterno" required>
        <br> <br>
        <input type="text" id="campoMaterno" placeholder="Apellido Materno" required>
        <br> <br>
        <input type="email" id="campoEmail" placeholder="Email" required>
        <br> <br>
        
        <button type="submit" id="miBoton">Generar Invitación</button>
    </form>

    <div id="resultado" style="margin-top: 20px; color: blue"></div>

   <script>
        const formulario = document.getElementById("miFormulario");
        const visor = document.getElementById("resultado");

        formulario.addEventListener("submit", function (event) {
            // Evita que la página se refresque
            event.preventDefault();

        
            const nombre = document.getElementById("campoNombre").value;
            const paterno = document.getElementById("campoPaterno").value;
            const materno = document.getElementById("campoMaterno").value;

            const nombreCompleto = nombre + " " + paterno + " " + materno;
            
            localStorage.setItem("nombreInvitado", nombreCompleto);
           
            let aviso = document.createElement("p");
            aviso.innerText = "¡Generando invitación para " + nombreCompleto + "...!";            
            
            visor.innerHTML = ""; 
            visor.appendChild(aviso);
            
            setTimeout(() => {
                window.location.href = "invitacion.html"; 
            }, 1000);
        });
    </script>

</body>
